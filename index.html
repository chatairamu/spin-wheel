<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Wheel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wheel-container">
        <div class="wheel">
            <div class="segment"><span>Coupon 1</span></div>
            <div class="segment"><span>100 Points</span></div>
            <div class="segment"><span>Coupon 2</span></div>
            <div class="segment"><span>200 Points</span></div>
            <div class="segment"><span>Coupon 3</span></div>
            <div class="segment"><span>300 Points</span></div>
            <div class="segment"><span>Coupon 4</span></div>
            <div class="segment"><span>400 Points</span></div>
        </div>
        <button id="spin-btn">Spin</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
